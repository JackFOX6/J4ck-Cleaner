<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    
    <!-- Border Crimson Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff003c" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <!-- Core Flame Violet Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff003c" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Shadow/Glow -->
  <path d="M256 32 L416 96 V240 C416 348 346 438 256 480 C166 438 96 348 96 240 V96 Z" 
        fill="none" stroke="#ff003c" stroke-width="12" filter="url(#glow)" opacity="0.6" />

  <!-- Main Shield Body -->
  <path d="M256 40 L408 100 V240 C408 340 342 426 256 468 C170 426 104 340 104 240 V100 Z" 
        fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Inner Tech Grid / Pulse Lines -->
  <path d="M256 120 V380 M180 200 H332 M190 300 H322" 
        stroke="#21262d" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Central Guardian Core Flame Symbol -->
  <path d="M256 160 C256 160 310 230 310 280 C310 310 286 340 256 340 C226 340 202 310 202 280 C202 230 256 160 256 160 Z" 
        fill="url(#flameGrad)" />

  <!-- Core Pulse Point -->
  <circle cx="256" cy="290" r="18" fill="#ffffff" opacity="0.9" />
</svg>
